<div id="cmdk" class="cmdk" hidden>
  <div class="cmdk-backdrop" data-cmdk-close></div>
  <div class="cmdk-panel" role="dialog" aria-modal="true" aria-label="Command palette">
    <div class="cmdk-input-row">
      <span class="cmdk-prompt">&gt;</span>
      <input
        id="cmdk-input"
        class="cmdk-input"
        type="text"
        placeholder="Jump to a page or article…"
        autocomplete="off"
        spellcheck="false"
        aria-label="Search pages and articles"
        aria-controls="cmdk-list"
      />
      <kbd class="cmdk-esc" data-cmdk-close>esc</kbd>
    </div>
    <ul id="cmdk-list" class="cmdk-list" role="listbox" aria-label="Results"></ul>
    <div id="cmdk-empty" class="cmdk-empty" hidden>
      <span class="cmdk-empty-prompt">bash: no matches found for "<span id="cmdk-empty-term"></span>"</span>
    </div>
    <div class="cmdk-foot">
      <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
      <span><kbd>↵</kbd> open</span>
      <span><kbd>esc</kbd> close</span>
    </div>
  </div>
</div>

<script type="application/json" id="cmdk-index">
[
  {"type":"page","title":"home","url":"/","hint":"~/"},
  {"type":"page","title":"articles","url":"/articles/","hint":"~/articles"},
  {"type":"page","title":"tools","url":"/tools/","hint":"~/tools"},
  {"type":"page","title":"whoami","url":"/whoami/","hint":"~/whoami"}
  {%- for post in site.posts -%}
  ,{"type":"article","title":{{ post.title | jsonify }},"url":{{ post.url | jsonify }},"hint":{{ post.date | date: "%Y-%m-%d" | jsonify }},"tags":{{ post.tags | join: " " | jsonify }}}
  {%- endfor -%}
]
</script>
