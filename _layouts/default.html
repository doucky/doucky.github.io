<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    // Applique le thème avant le rendu pour éviter tout flash
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (!t) {
          t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
      } catch (e) {}
    })();
  </script>
  {% include head.html %}
  <style>
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    .blink { animation: blink 1s step-start infinite; }
  </style>
</head>
<body>

  {% include nav.html %}

  {{ content }}

  {% include footer.html %}
  {% include command-palette.html %}
  <script src="/js/theme-toggle.js?v={{ site.time | date: '%s' }}" defer></script>
  <script src="/js/command-palette.js?v={{ site.time | date: '%s' }}" defer></script>
  {% if page.page_js %}<script src="/js/{{ page.page_js }}.js" defer></script>{% endif %}
  <script data-goatcounter="https://doucky.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
  </body>
</html>
